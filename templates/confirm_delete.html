{% extends "base.html" %}
{% block title %}Delete{% endblock %}
{% block content %}
<div class="card">
    <h1>Delete {{ type }}</h1>
    <p>Are you sure you want to delete "{{ object }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button class="danger" type="submit">Confirm delete</button>
        <a class="button" href="{% url 'home' %}">Cancel</a>
    </form>
</div>
{% endblock %}
