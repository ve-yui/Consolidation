{% extends "base.html" %}
{% block title %}Approve Article{% endblock %}
{% block content %}
<div class="card">
    <h1>Approve Article</h1>
    <h2>{{ article.title }}</h2>
    <p>{{ article.content }}</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Approve and notify subscribers</button>
    </form>
</div>
{% endblock %}
